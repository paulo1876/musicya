<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MusicYa - Contacto Simplificado</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body{background:#181818;color:white;font-family:Arial,sans-serif}
.navbar,footer{background:#111}
.navbar a{color:white}
.navbar a:hover{color:#d946ef}
.navbar a.active{color:#d946ef;font-weight:bold}

.section-title{
    color:#d946ef;
    font-weight:bold;
    margin-bottom:20px
}

.form-container{
    background:#252525;
    border-radius:15px;
    padding:35px;
    box-shadow:0 10px 30px #0008;
    margin-top:40px;
    margin-bottom:50px;
}

.form-label{color:#eee;font-weight:600}
.form-control{
    background-color:#181818;
    border:1px solid #444;
    color:#fff;
}
.form-control:focus{
    background-color:#202020;
    color:#fff;
    border-color:#d946ef;
    box-shadow:0 0 0 0.25rem rgba(217, 70, 239, 0.25);
}
.form-control::placeholder{color:#888}

.btn-primary-custom{
    background-color:#d946ef;
    border-color:#d946ef;
    color:white;
    font-weight:bold;
}
.btn-primary-custom:hover{
    background-color:#c026d3;
    border-color:#c026d3;
    color:white;
}

.search-box{display:flex;gap:8px}
.search-box input{
    background:#252525;
    border:1px solid #444;
    color:white;
    border-radius:20px;
    padding:8px 14px;
    width:190px
}
.search-box button{
    border:0;
    background:#d946ef;
    color:white;
    border-radius:20px;
    padding:8px 14px
}

.menu-toggle{
    display:none;
    border:0;
    background:none;
    color:white;
    font-size:28px
}

footer{padding:30px;text-align:center;margin-top:50px}

@media(max-width:768px){
    .menu-toggle{display:block}
    .nav-menu{
        display:none!important;
        flex-direction:column;
        width:100%;
        padding-top:15px
    }
    .nav-menu.show{display:flex!important}
    .search-box{width:100%}
    .search-box input{width:100%}
}
</style>
</head>

<body>

<!-- MENÚ -->
<nav class="navbar navbar-dark sticky-top shadow">
<div class="container">
<div class="d-flex justify-content-between align-items-center w-100">

<a class="navbar-brand fw-bold fs-4" href="index.html">
🎵 MusicYa
</a>

<button class="menu-toggle" onclick="toggleMenu()">☰</button>

<div id="navMenu" class="d-flex gap-3 align-items-center nav-menu">
<a class="text-decoration-none" href="index.html">Inicio</a>
<a class="text-decoration-none" href="index.html#generos">Géneros</a>
<a class="text-decoration-none" href="index.html">🛒 Tienda</a>
<a class="text-decoration-none" href="index.html#musica">Música</a>
<a class="text-decoration-none" href="index.html#nosotros">Nosotros</a>
<a class="text-decoration-none btn btn-outline-light btn-sm px-3 active" href="contacto.html">Contacto</a>
<a class="text-decoration-none btn btn-primary-custom btn-sm px-3 " href="registro.html">Registro</a>

<div class="search-box">
<input id="searchInput" type="text" placeholder="Buscar...">
<button onclick="window.location.href='index.html'">🔍</button>
</div>

</div>
</div>
</div>
</nav>

<!-- FORMULARIO CONTENEDOR (Simplificado) -->
<main class="container py-4">
<div class="row justify-content-center">
<!-- Se redujo el ancho de la columna a col-md-8 col-lg-6 para que el formulario se vea mejor proporcionado -->
<div class="col-12 col-md-8 col-lg-6">
<div class="form-container">
    <h1 class="text-center section-title mb-2">Contáctanos</h1>
    <p class="text-center text-secondary mb-4">Envíanos un mensaje y te responderemos a la brevedad.</p>

    <form action="#" method="POST">
        
        <div class="mb-3">
            <label for="nombre" class="form-label">Nombre</label>
            <input type="text" class="form-control" id="nombre" name="nombre" placeholder="Ej: Juan Pérez" required>
        </div>
        
        <div class="mb-3">
            <label for="email" class="form-label">Correo Electrónico</label>
            <input type="email" class="form-control" id="email" name="email" placeholder="correo@ejemplo.com" required>
        </div>
        
        <div class="mb-4">
            <label for="mensaje" class="form-label">Mensaje</label>
            <textarea class="form-control" id="mensaje" name="mensaje" rows="5" placeholder="Escribe tu mensaje aquí..." required></textarea>
        </div>

        <button type="submit" class="btn btn-primary-custom w-100 py-2">Enviar Mensaje</button>

    </form>
</div>
</div>
</div>
</main>

<!-- FOOTER -->
<footer>
<p>© 2026 MusicYa</p>
<p>🎵 La música nos conecta</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
function toggleMenu(){
    document.getElementById("navMenu").classList.toggle("show");
}
</script>
</body>
</html>
